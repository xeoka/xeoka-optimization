name: cleanup
on: workflow_dispatch
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Очистка старых веток и релизов после зачистки истории
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pd
          gh release download pack-data -p pack.xkp -D /tmp/pd --repo "$GITHUB_REPOSITORY"
          ls -la /tmp/pd
          for t in v1 latest pack-data; do gh release delete "$t" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true; done
          git push origin --delete webview-ui xeoka-tech-rebrand || true
          gh release create pack-data /tmp/pd/pack.xkp --target main --title "pack-data (зашифрованный пак)" --notes "Зашифрованный пак. Открывается только лицензией, выданной автором. Состав: PACK-CONTENTS.md в репозитории." --repo "$GITHUB_REPOSITORY"
