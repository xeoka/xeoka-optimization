name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Publish
        run: dotnet publish app/XeokaPack/XeokaPack.csproj -c Release -o out
      - name: Build license generator (проверка, в релиз не идёт)
        run: dotnet build tools/LicenseGen/LicenseGen.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: XEOKA-PACK
          path: out/XEOKA-PACK.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item out/XEOKA-PACK.exe stage/
          if (Test-Path out/Assets) { Copy-Item out/Assets stage/Assets -Recurse }
          Copy-Item "ПРАВА-И-РАСПРОСТРАНЕНИЕ.txt" stage/
          # Папки пака переименованы в бессмысленные коды (не по номерам), чтобы их нельзя было
          # опознать по названию. Список фиксированный, а не по маске, т.к. маска по номерам больше не подходит.
          $packDirs = @('ubea4o','i5aaej','egumyi','yyau84','p2ihcn','nt0f2d','j1z9hi','ycbzwx','gmpqia','bcqacr','jas806','lmka7q','dsv1kz','pmq7m9','onnznm','bxkoqu','wpo0ih')
          foreach ($d in $packDirs) { if (Test-Path $d) { Copy-Item $d stage/ -Recurse } }
          # Файл-метка в корне пака: по нему приложение узнаёт папку с паком, раз имена папок больше ничего не говорят.
          Set-Content -Path stage/.xk-pack-marker -Value 'XEOKA-PACK-V1' -NoNewline
          Compress-Archive -Path stage/* -DestinationPath XEOKA-PACK-full.zip -Force
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest out/XEOKA-PACK.exe XEOKA-PACK-full.zip --title "xeoka optimization (последняя сборка)" --notes "XEOKA-PACK.exe — просто скачайте и запустите, пак не нужен: вкладка Инструменты (отключение UAC, активация Windows, уведомления, удаление программ) и проверка/активация лицензии работают сразу. Для твиков оптимизации (вкладка Оптимизация) нужны файлы пака — тогда скачайте XEOKA-PACK-full.zip, распакуйте целиком и запустите XEOKA-PACK.exe из распакованной папки. Запрашивает права администратора сам." --latest
