name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Publish
        run: dotnet publish app/XeokaPack/XeokaPack.csproj -c Release -o out
      - name: Build license generator (проверка, в релиз не идёт)
        run: dotnet build tools/LicenseGen/LicenseGen.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: XEOKA-PACK
          path: out/XEOKA-PACK.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LK: ${{ secrets.LICENSE_PRIVATE_KEY }}
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item out/XEOKA-PACK.exe stage/
          if (Test-Path out/Assets) { Copy-Item out/Assets stage/Assets -Recurse }
          Copy-Item "ПРАВА-И-РАСПРОСТРАНЕНИЕ.txt" stage/
          # Папки пака переименованы в бессмысленные коды (не по номерам), чтобы их нельзя было
          # опознать по названию. Список фиксированный, а не по маске, т.к. маска по номерам больше не подходит.
          $packDirs = @('1. База','2. Драйверы','3. CRU','4. План-питания','5. Геймбар-И-Игровой-Режим','6. Защитник-Виндовс','7. Обновления-Windows','8. Авторанс','9. Настройки-Сетевого-Адаптера','10. Службы-И-Драйверы','11. Диспетчер-Устройств','12. BIOS','13. Аффинити','14. Прерывания-Системного-Таймера','15. ММЦСС','16. ФСЕ-И-ФСО','17. Вин-32-Приорити-Сеперейшн')
          # Пак хранится только в зашифрованном виде (релиз pack-data). Открытых файлов пака в репозитории нет.
          # Если рядом лежат открытые папки (старый способ), шифруем их и обновляем pack-data, иначе берём готовый pack.xkp.
          $have = @($packDirs | Where-Object { Test-Path $_ })
          if ($have.Count -gt 0) {
            New-Item -ItemType Directory -Force stage-pack | Out-Null
            foreach ($d in $have) { Copy-Item $d stage-pack/ -Recurse }
            Set-Content -Path stage-pack/.xk-pack-marker -Value 'XEOKA-PACK-V1' -NoNewline
            if (-not $env:LK) { throw 'Секрет LICENSE_PRIVATE_KEY не задан: без него пак не зашифровать.' }
            Set-Content -Path private.pem -Value $env:LK
            dotnet run --project tools/LicenseGen -c Release -- pack --key private.pem --dir stage-pack --out stage/pack.xkp
            if ($LASTEXITCODE -ne 0) { throw 'Не удалось зашифровать пак' }
            Remove-Item private.pem -Force
            gh release delete pack-data --yes --cleanup-tag 2>$null
            gh release create pack-data stage/pack.xkp --title "pack-data (зашифрованный пак)" --notes "Зашифрованный пак. Открывается только лицензией, выданной автором. Состав: PACK-CONTENTS.md в репозитории."
          } else {
            gh release download pack-data -p pack.xkp -D stage
            if (-not (Test-Path stage/pack.xkp)) { throw 'Нет открытых папок пака и нет релиза pack-data с pack.xkp' }
          }
          Compress-Archive -Path stage/* -DestinationPath XEOKA-PACK-full.zip -Force
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest out/XEOKA-PACK.exe XEOKA-PACK-full.zip --title "xeoka tech (последняя сборка)" --notes "Скачайте XEOKA-PACK-full.zip, распакуйте архив целиком и запустите XEOKA-PACK.exe (права администратора запросятся сами). Файлы пака лежат в зашифрованном pack.xkp и открываются только лицензией, выданной автором для вашего ПК. Отдельный XEOKA-PACK.exe без pack.xkp открывает только интерфейс." --latest
