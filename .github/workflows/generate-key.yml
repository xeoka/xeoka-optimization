name: Generate License
on:
  workflow_dispatch:
    inputs:
      hw_id:
        description: 'ID компьютера покупателя (HWID)'
        required: true
        type: string
      note:
        description: 'Имя покупателя / заметка'
        required: true
        type: string
      days:
        description: 'Срок действия в днях (0 = бессрочно)'
        required: false
        default: '0'
        type: string
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Create private key file
        env:
          KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
        run: printf '%s\n' "$KEY" > private.pem
      - name: Run LicenseGen
        env:
          HW: ${{ github.event.inputs.hw_id }}
          NOTE: ${{ github.event.inputs.note }}
          DAYS: ${{ github.event.inputs.days }}
        run: dotnet run --project tools/LicenseGen -- --key private.pem --hw "$HW" --note "$NOTE" --days "${DAYS:-0}"
