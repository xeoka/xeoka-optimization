name: Revoke Key
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'ID ключа (8 символов из Generate License) или ID компьютера'
        required: true
        type: string
      reason:
        description: 'Причина / заметка'
        required: false
        default: ''
        type: string
permissions:
  contents: write
jobs:
  revoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Добавить в revoked.txt
        env:
          TARGET: ${{ github.event.inputs.target }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          T=$(printf '%s' "$TARGET" | tr -d '[:space:]' | tr 'a-z' 'A-Z')
          if ! printf '%s' "$T" | grep -Eq '^[A-F0-9]{8}$|^[A-Z0-9]{4}(-[A-Z0-9]{4}){4}$'; then echo "Неверный формат ID"; exit 1; fi
          R=$(printf '%s' "$REASON" | tr -d '\r\n')
          echo "$T  # $R $(date -u +%F)" >> revoked.txt
          git config user.name "xeoka-bot"
          git config user.email "bot@users.noreply.github.com"
          git add revoked.txt
          git commit -m "Отозван ключ $T"
          git push
