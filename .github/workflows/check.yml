name: check
on:
  push:
    branches: [webview-ui]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Publish
        run: dotnet publish app/XeokaPack/XeokaPack.csproj -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: XEOKA-PACK-test
          path: out/XEOKA-PACK.exe
