name: check
on:
  push:
    branches: [webview-ui]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Publish
        run: dotnet publish app/XeokaPack/XeokaPack.csproj -c Release -o out
      - name: Selftest шифрования пака и лицензии
        shell: pwsh
        run: |
          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          Set-Content test.pem $rsa.ExportPkcs8PrivateKeyPem()
          New-Item -ItemType Directory -Force tp/sub | Out-Null
          Set-Content tp/sub/файл.txt 'привет'
          Set-Content tp/.xk-pack-marker 'XEOKA-PACK-V1' -NoNewline
          dotnet run --project tools/LicenseGen -c Release -- pack --key test.pem --dir tp --out pack.xkp
          if ($LASTEXITCODE -ne 0) { throw 'pack failed' }
          $o = dotnet run --project tools/LicenseGen -c Release -- --key test.pem --hw AAAA-BBBB-CCCC-DDDD-EEEE --note t
          $code = ($o | Where-Object { $_ -match '^[A-Za-z0-9+/=]+\.[A-Za-z0-9+/=]+$' } | Select-Object -First 1)
          if (-not $code) { throw 'no license code' }
          $payload = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($code.Split('.')[0])) | ConvertFrom-Json
          $raw = [Convert]::FromBase64String($payload.pk)
          $sha = [System.Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes('xeoka-wrap|AAAA-BBBB-CCCC-DDDD-EEEE'))
          $key = New-Object byte[] ($raw.Length - 28)
          $g = [System.Security.Cryptography.AesGcm]::new($sha, 16)
          $g.Decrypt($raw[0..11], $raw[28..($raw.Length-1)], $raw[12..27], $key)
          $d = [IO.File]::ReadAllBytes('pack.xkp')
          $plain = New-Object byte[] ($d.Length - 32)
          $g2 = [System.Security.Cryptography.AesGcm]::new($key, 16)
          $g2.Decrypt($d[4..15], $d[32..($d.Length-1)], $d[16..31], $plain, [Text.Encoding]::ASCII.GetBytes('XKP1'))
          [IO.File]::WriteAllBytes('t.zip', $plain)
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path t.zip))
          $names = $z.Entries.FullName -join ','
          Write-Host $names
          if ($names -notmatch 'файл.txt' -or $names -notmatch 'xk-pack-marker') { throw "bad zip: $names" }
      - uses: actions/upload-artifact@v4
        with:
          name: XEOKA-PACK-test
          path: out/XEOKA-PACK.exe
